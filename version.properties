# QMLKit version - bump this to trigger a GitHub Release via .github/workflows/ci.yml
# Format: version=MAJOR.MINOR.PATCH  (e.g., version=0.1.0, version=1.2.3)
# The workflow publishes a release with tag v<version> whenever this file is updated on main.
# - If releasenotes.properties is also changed in the same push, its content is used as the release body.
# - Otherwise release notes are auto-generated smartly (GitHub generate-notes API + git log fallback).
version=0.1.2
