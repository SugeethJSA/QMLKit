[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qmlkit"
version = "0.1.0"
description = "Hybrid Quantum Machine Learning Platform for Early Disease Detection via Canine Olfactory VOC Sensing"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "QMLKit Development Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pennylane>=0.40.0",
    "scikit-learn>=1.4.0",
    "torch>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "httpx>=0.27.0",
    "xgboost>=2.0.0",
    "shap>=0.45.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend", "docs"]

[tool.ruff.lint]
# Pragmatic baseline: real errors (E), pyflakes (F), import hygiene (I),
# bug-prone patterns (B). Typing-modernization (UP) and style families
# tracked separately - not blocking CI yet.
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Demo scripts keep print-style formatting; tests may re-import fixtures.
"scripts/*" = ["F541"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
