# Optional custom release notes for the NEXT release.
# This file is ONLY used when it is changed in the SAME push/commit as version.properties.
# Otherwise the workflow autogenerates notes smartly.
#
# You can use either format:
# 1) Raw markdown (recommended) - whole file (minus # comments) is used as release body:
#    ## What's Changed
#    - Added hybrid stacking ensemble
#    - Fixed BioZZ covariance handling
#
# 2) Properties style - single key (notes / releasenotes / release.notes / changelog):
#    release.notes=## What's Changed\n- Feature A\n- Fix B
#    (use \n for new lines)
#
# If this file is not changed alongside version.properties, it is ignored and auto-notes are used.
# Example placeholder (edit on next version bump):

## What's Changed
- Init release
