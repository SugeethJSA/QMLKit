name: Release

# Publish a GitHub Release whenever version.properties is updated.
# - Compiles native app installers for Windows (.exe setup), macOS (.dmg installer), and Linux (.deb package + self-installer).
# - If releasenotes.properties is ALSO changed in the same push, its content is used as the release body.
# - Otherwise release notes are auto-generated smartly (GitHub generate-notes API + git log fallback).
# Manual trigger via workflow_dispatch is also supported.

on:
  push:
    branches: [main]
    paths:
      - "version.properties"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prep-release:
    name: Prepare Release & Gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_custom_notes: ${{ steps.notes.outputs.custom }}
    steps:
      - name: Checkout (full history for tags & diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Gate - verify version.properties actually changed (push only)
        id: gate
        shell: bash
        run: |
          set -e
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "manual dispatch -> allow"
            echo "proceed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          # handle initial push (before = 0) or missing history
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]] || [[ -z "$BEFORE" ]] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "no valid BEFORE, checking HEAD~1"
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              BEFORE="HEAD~1"
            else
              echo "first commit, allow"
              echo "proceed=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "Diff $BEFORE..$SHA"
          CHANGED_FILES=$(git diff --name-only "$BEFORE" "$SHA" || git diff --name-only HEAD~1 HEAD || echo "version.properties")
          echo "$CHANGED_FILES"
          if echo "$CHANGED_FILES" | grep -q "version.properties"; then
            echo "version.properties changed -> proceed"
            echo "proceed=true" >> $GITHUB_OUTPUT
          else
            echo "version.properties NOT changed -> skip release"
            echo "proceed=false" >> $GITHUB_OUTPUT
          fi

      - name: Parse version from version.properties
        if: steps.gate.outputs.proceed == 'true'
        id: version
        shell: bash
        run: |
          set -e
          FILE="version.properties"
          if [[ ! -f "$FILE" ]]; then
            echo "::error::version.properties not found at repo root"
            exit 1
          fi
          echo "--- version.properties ---"
          cat "$FILE"
          echo "--------------------------"
          # Try to extract version= / version: / app.version= etc. (case-insensitive, allow spaces)
          VERSION_RAW=""
          # 1) look for line with 'version' key
          if grep -qiE '^\s*[^#]*version\s*[:=]' "$FILE"; then
            VERSION_RAW=$(grep -i -m1 -E '^\s*[^#]*version\s*[:=]' "$FILE" | sed -E 's/^\s*[^=:=]*[:=]\s*//' | tr -d '\r' | xargs || true)
          fi
          # 2) fallback: first non-empty non-comment line
          if [[ -z "$VERSION_RAW" ]]; then
            VERSION_RAW=$(grep -v '^\s*#' "$FILE" | grep -v '^\s*!' | grep -v '^\s*$' | head -n1 | tr -d '\r' | xargs || true)
            # if that line still contains '=', take after '='
            if echo "$VERSION_RAW" | grep -q '='; then
              # only strip if it looks like key=value with single value, not markdown
              KV_COUNT=$(echo "$VERSION_RAW" | tr -cd '=' | wc -c)
              if [[ "$KV_COUNT" -eq 1 ]] && ! echo "$VERSION_RAW" | grep -qE '^\s*[-*#>]'; then
                VERSION_RAW=$(echo "$VERSION_RAW" | sed -E 's/^[^=]*=\s*//')
              fi
            fi
          fi
          # strip leading 'v' and whitespace
          VERSION=$(echo "$VERSION_RAW" | sed -E 's/^[vV]//' | xargs)
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not parse version from version.properties (raw='$VERSION_RAW')"
            exit 1
          fi
          # basic semver validation (allow 0.1.0, 1.2.3-alpha, 1.0.0+build etc.)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::warning::Version '$VERSION' does not look like semver (expected x.y.z), proceeding anyway"
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "raw=$VERSION_RAW" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION  tag: $TAG"

      - name: Check if version actually bumped vs previous commit
        if: steps.gate.outputs.proceed == 'true'
        id: bump
        shell: bash
        run: |
          set -e
          CUR="${{ steps.version.outputs.version }}"
          # get version from previous commit if exists
          PREV_RAW=""
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1 && git show HEAD~1:version.properties >/tmp/prev_version.properties 2>/dev/null; then
            if grep -qiE '^\s*[^#]*version\s*[:=]' /tmp/prev_version.properties; then
              PREV_RAW=$(grep -i -m1 -E '^\s*[^#]*version\s*[:=]' /tmp/prev_version.properties | sed -E 's/^\s*[^=:=]*[:=]\s*//' | tr -d '\r' | xargs || true)
            else
              PREV_RAW=$(grep -v '^\s*#' /tmp/prev_version.properties | grep -v '^\s*!' | grep -v '^\s*$' | head -n1 | tr -d '\r' | xargs || true)
              if echo "$PREV_RAW" | grep -q '='; then PREV_RAW=$(echo "$PREV_RAW" | sed -E 's/^[^=]*=\s*//'); fi
            fi
            PREV=$(echo "$PREV_RAW" | sed -E 's/^[vV]//' | xargs)
            echo "Previous version: $PREV (raw: $PREV_RAW)"
            if [[ "$PREV" == "$CUR" ]]; then
              echo "Version unchanged ($CUR) -> will skip if tag already exists"
              echo "bumped=false" >> $GITHUB_OUTPUT
            else
              echo "Version bumped $PREV -> $CUR"
              echo "bumped=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "No previous version.properties found (first version), treat as bumped"
            echo "bumped=true" >> $GITHUB_OUTPUT
          fi

      - name: Check if tag already exists
        if: steps.gate.outputs.proceed == 'true'
        id: tagcheck
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git tag --list | grep -qx "$TAG"; then
            echo "Tag $TAG already exists locally"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            # also check remote
            if git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
              echo "Tag $TAG exists on remote"
              echo "exists=true" >> $GITHUB_OUTPUT
            else
              echo "Tag $TAG does not exist"
              echo "exists=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Update proceed flag if tag exists and version not bumped
        if: steps.gate.outputs.proceed == 'true' && steps.tagcheck.outputs.exists == 'true' && steps.bump.outputs.bumped == 'false'
        shell: bash
        run: |
          echo "::notice::Tag ${{ steps.version.outputs.tag }} already exists and version not bumped - skipping release (idempotent)."
          echo "proceed=false" >> $GITHUB_OUTPUT

      - name: Detect if releasenotes.properties was changed in this push
        if: steps.gate.outputs.proceed == 'true'
        id: notes
        shell: bash
        run: |
          set -e
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # manual: use custom if file exists and non-empty (keep markdown ## headers)
            if [[ -f "releasenotes.properties" ]] && [[ -s "releasenotes.properties" ]]; then
              # filter only single-# properties comments (keep ## markdown headers) and ! comments
              NON_COMMENT=$(grep -vE '^\s*#[^#]' releasenotes.properties | grep -v '^\s*!' | grep -v '^\s*$' | head -n1 || true)
              if [[ -n "$NON_COMMENT" ]]; then
                echo "workflow_dispatch with non-empty releasenotes.properties -> custom"
                echo "custom=true" >> $GITHUB_OUTPUT
                exit 0
              fi
            fi
            echo "workflow_dispatch without custom notes -> autogenerate"
            echo "custom=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]] || [[ -z "$BEFORE" ]] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then BEFORE="HEAD~1"; else BEFORE="HEAD"; fi
          fi
          echo "Checking diff $BEFORE..$SHA for releasenotes.properties"
          DIFF_FILES=$(git diff --name-only "$BEFORE" "$SHA" 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          echo "Changed files:"
          echo "$DIFF_FILES"
          if echo "$DIFF_FILES" | grep -q "releasenotes.properties"; then
            echo "releasenotes.properties changed in this push -> use custom"
            echo "custom=true" >> $GITHUB_OUTPUT
          else
            echo "releasenotes.properties NOT changed -> autogenerate"
            echo "custom=false" >> $GITHUB_OUTPUT
          fi

      - name: Build release body from releasenotes.properties (custom)
        if: steps.gate.outputs.proceed == 'true' && steps.notes.outputs.custom == 'true'
        shell: bash
        run: |
          set -e
          FILE="releasenotes.properties"
          echo "Using custom $FILE"
          cat "$FILE"
          echo "--- parsing ---"
          python3 << 'PY'
          import pathlib, re
          p = pathlib.Path("releasenotes.properties")
          text = p.read_text(encoding="utf-8", errors="ignore")
          lines = text.splitlines()
          def is_comment(line: str) -> bool:
              s = line.lstrip()
              if not s:
                  return False
              if s.startswith("!"):
                  return True
              # single '#' is a properties comment, but '##'/'###' are markdown headers — keep them
              if s.startswith("#") and not s.startswith("##"):
                  return True
              return False
          filtered = [l for l in lines if not is_comment(l)]
          raw_filtered = "\n".join(filtered).strip()
          raw_full = text.strip()
          # try to detect properties-style key
          # allow keys: releasenotes, releaseNotes, release.notes, release_notes, notes, changelog
          m = re.match(r'^\s*(releasenotes|releaseNotes|release\.notes|release_notes|notes|changelog)\s*[:=]\s*(.*)', raw_filtered, re.IGNORECASE | re.DOTALL)
          if m:
              # m.group(2) contains value and possibly following lines (due to DOTALL)
              # Re-parse: split filtered into first line and rest
              first_line = filtered[0] if filtered else ""
              m2 = re.match(r'^\s*(releasenotes|releaseNotes|release\.notes|release_notes|notes|changelog)\s*[:=]\s*(.*)', first_line, re.IGNORECASE)
              if m2:
                  first_val = m2.group(2).strip()
                  rest = "\n".join(filtered[1:]).strip()
                  if first_val and rest:
                      notes = first_val + "\n" + rest
                  elif first_val:
                      notes = first_val
                  else:
                      notes = rest
              else:
                  notes = m.group(2)
              notes = notes.replace("\\n", "\n")
          else:
              # fallback: if file is single key=value and not markdown, extract value
              if len(filtered) == 1 and "=" in filtered[0] and not filtered[0].lstrip().startswith(("-", "*", "#", ">")):
                  notes = filtered[0].split("=", 1)[1].strip().replace("\\n", "\n")
              else:
                  # treat whole file (minus single-# comments) as markdown, or full file if that was empty
                  notes = raw_filtered if raw_filtered else raw_full
                  notes = notes.replace("\\n", "\n")
          if not notes.strip():
              notes = raw_filtered or raw_full
          # ensure not empty
          if not notes.strip():
              notes = "No release notes provided."
          mkdir_path = pathlib.Path("build-notes")
          mkdir_path.mkdir(parents=True, exist_ok=True)
          (mkdir_path / "release_notes.md").write_text(notes, encoding="utf-8")
          print("--- generated build-notes/release_notes.md ---")
          print(notes[:2000])
          PY
          echo "custom body written to build-notes/release_notes.md"
          cat build-notes/release_notes.md

      - name: Autogenerate release notes (smart fallback)
        if: steps.gate.outputs.proceed == 'true' && steps.notes.outputs.custom != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.version.outputs.tag }}"
          # previous tag for changelog range
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          # also try sorted semver tags
          if [[ -z "$PREV_TAG" ]]; then
            PREV_TAG=$(git tag --sort=-v:refname | grep -v "$TAG" | head -n1 || echo "")
          fi
          echo "Current tag: $TAG"
          echo "Previous tag: ${PREV_TAG:-<none>}"
          # Try GitHub generate-notes API (smart: categorizes by conventional commits, PRs)
          mkdir -p build-notes /tmp
          GEN_SUCCESS=false
          if [[ -n "$GH_TOKEN" ]]; then
            echo "Attempting GitHub generate-notes API..."
            # build JSON payload: tag_name required, previous_tag_name optional, target_commitish main
            if [[ -n "$PREV_TAG" ]]; then
              JSON=$(jq -n --arg tag "$TAG" --arg prev "$PREV_TAG" --arg target "main" '{tag_name:$tag, previous_tag_name:$prev, target_commitish:$target}')
            else
              JSON=$(jq -n --arg tag "$TAG" --arg target "main" '{tag_name:$tag, target_commitish:$target}')
            fi
            echo "$JSON"
            HTTP_CODE=$(curl -s -o /tmp/gen.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/generate-notes" \
              -d "$JSON" || echo "000")
            echo "API HTTP code: $HTTP_CODE"
            if [[ "$HTTP_CODE" == "200" ]] && jq -e '.body' /tmp/gen.json >/dev/null 2>&1; then
              BODY=$(jq -r '.body' /tmp/gen.json)
              if [[ -n "$BODY" && "$BODY" != "null" ]]; then
                echo "$BODY" > build-notes/release_notes.md
                echo "Used GitHub API generated notes"
                cat build-notes/release_notes.md
                GEN_SUCCESS=true
              fi
            else
              echo "API failed or no body, fallback to git log"
              cat /tmp/gen.json || true
            fi
          fi
          if [[ "$GEN_SUCCESS" != "true" ]]; then
            echo "Falling back to git log autogeneration"
            if [[ -n "$PREV_TAG" ]]; then
              RANGE="$PREV_TAG..HEAD"
              COMPARE_URL="https://github.com/${{ github.repository }}/compare/$PREV_TAG...$TAG"
            else
              RANGE="HEAD"
              COMPARE_URL="https://github.com/${{ github.repository }}/commits/$TAG"
            fi
            {
              echo "## What's Changed"
              echo ""
              # grouped log: features, fixes, others - simple)
              echo "### Commits"
              git log "$RANGE" --pretty=format:"- %s (%h) by %an" --no-merges | head -n 100 || echo "- No commits found"
              echo ""
              echo ""
              echo "**Full Changelog**: $COMPARE_URL"
              echo ""
              echo "_Auto-generated from git history (fallback)._"
            } > build-notes/release_notes.md
            cat build-notes/release_notes.md
          fi

      - name: Upload release notes artifact
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: build-notes/release_notes.md
          retention-days: 1

  build-binaries:
    name: Build (${{ matrix.target }})
    needs: prep-release
    if: needs.prep-release.outputs.proceed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-latest
            target: macos-arm64
          - os: ubuntu-latest
            target: linux-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build Frontend Static Export
        run: pnpm --filter frontend build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install PyInstaller
          python -m pip install -e .

      - name: Build Desktop Application Bundle (PyInstaller)
        run: |
          python -m PyInstaller packaging/qmlkit_desktop.spec --noconfirm --distpath dist --workpath build/pyinstaller

      # ----------------- WINDOWS INSTALLER & PORTABLE -----------------
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress

      - name: Build Windows Setup Wizard Installer (.exe) & Portable Zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts
          $ver = "${{ needs.prep-release.outputs.version }}"
          $tag = "${{ needs.prep-release.outputs.tag }}"
          
          # 1) Inno Setup Compiler
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }
          Write-Host "Compiling Windows installer with: $iscc"
          & $iscc "/DMyAppVersion=$ver" "packaging/installer/qmlkit.iss"
          
          # 2) Portable Zip
          Compress-Archive -Path "dist/QMLKitConsole" -DestinationPath "dist-artifacts/QMLKitConsole-${tag}-windows-x64-portable.zip"
          
          Get-ChildItem dist-artifacts/

      # ----------------- MACOS DMG INSTALLER & ZIP -----------------
      - name: Build macOS Drag-and-Drop (.dmg) Installer & App Archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist-artifacts
          VERSION_TAG="${{ needs.prep-release.outputs.tag }}"
          TARGET="${{ matrix.target }}"
          
          # 1) Build .dmg with Applications symlink for drag-and-drop install
          DMG_TMP="$(mktemp -d)"
          cp -R "dist/QMLKitConsole.app" "$DMG_TMP/"
          ln -s /Applications "$DMG_TMP/Applications"
          hdiutil create -volname "QMLKit Console" -srcfolder "$DMG_TMP" -ov -format UDZO "dist-artifacts/QMLKitConsole-${VERSION_TAG}-${TARGET}.dmg"
          rm -rf "$DMG_TMP"

          # 2) App bundle Zip
          (cd dist && zip -r -y "../dist-artifacts/QMLKitConsole-${VERSION_TAG}-${TARGET}-app.zip" QMLKitConsole.app)
          
          ls -lh dist-artifacts/

      # ----------------- LINUX DEB PACKAGE & TARBALL -----------------
      - name: Build Linux Debian (.deb) Package & Universal Tarball Installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist-artifacts
          VERSION="${{ needs.prep-release.outputs.version }}"
          VERSION_TAG="${{ needs.prep-release.outputs.tag }}"
          
          # 1) Build native Debian (.deb) package
          bash packaging/linux/build_deb.sh "$VERSION" "dist/QMLKitConsole" "dist-artifacts"
          
          # 2) Self-installing Universal Tarball with install.sh/uninstall.sh
          cp packaging/linux/install.sh packaging/linux/uninstall.sh dist/QMLKitConsole/
          chmod +x dist/QMLKitConsole/install.sh dist/QMLKitConsole/uninstall.sh dist/QMLKitConsole/QMLKitConsole
          tar -czf "dist-artifacts/QMLKitConsole-${VERSION_TAG}-linux-x64.tar.gz" -C dist QMLKitConsole
          
          ls -lh dist-artifacts/

      - name: Upload Binary & Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist-artifacts/*
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [prep-release, build-binaries]
    if: needs.prep-release.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Release Notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: build-notes

      - name: Download Binary & Installer Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        shell: bash
        run: |
          echo "=== Release Assets to Upload ==="
          ls -lh release-assets/
          echo "=== Release Notes Preview ==="
          cat build-notes/release_notes.md

      - name: Create GitHub Release (custom notes)
        if: needs.prep-release.outputs.is_custom_notes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prep-release.outputs.tag }}
          name: Release ${{ needs.prep-release.outputs.tag }}
          body_path: build-notes/release_notes.md
          files: release-assets/*
          generate_release_notes: false
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (autogenerated notes)
        if: needs.prep-release.outputs.is_custom_notes != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prep-release.outputs.tag }}
          name: Release ${{ needs.prep-release.outputs.tag }}
          body_path: build-notes/release_notes.md
          files: release-assets/*
          generate_release_notes: false
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        shell: bash
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`${{ needs.prep-release.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: \`${{ needs.prep-release.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Notes Source**: \`${{ needs.prep-release.outputs.is_custom_notes == 'true' && 'releasenotes.properties (custom)' || 'autogenerated (GitHub API + git log)' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Compiled Native Installers & Packages" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Type | Target OS | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          for f in release-assets/*; do
            if [ -f "$f" ]; then
              fname=$(basename "$f")
              size=$(ls -lh "$f" | awk '{print $5}')
              if [[ "$fname" == *"-installer.exe" ]]; then
                echo "| \`$fname\` ($size) | **Installer** | Windows (x64) | Inno Setup Graphical Setup Wizard (Start Menu & Desktop shortcuts) |" >> $GITHUB_STEP_SUMMARY
              elif [[ "$fname" == *"-portable.zip" ]] && [[ "$fname" == *"windows"* ]]; then
                echo "| \`$fname\` ($size) | Portable | Windows (x64) | Standalone portable folder (no install required) |" >> $GITHUB_STEP_SUMMARY
              elif [[ "$fname" == *".dmg" ]]; then
                echo "| \`$fname\` ($size) | **Installer** | macOS (Apple Silicon) | Native Drag-and-Drop Disk Image into \`/Applications\` |" >> $GITHUB_STEP_SUMMARY
              elif [[ "$fname" == *"-app.zip" ]]; then
                echo "| \`$fname\` ($size) | Bundle | macOS (Apple Silicon) | Standalone \`QMLKitConsole.app\` archive |" >> $GITHUB_STEP_SUMMARY
              elif [[ "$fname" == *".deb" ]]; then
                echo "| \`$fname\` ($size) | **Installer** | Linux (Ubuntu/Debian) | Native Debian package with App Launcher integration (\`dpkg -i\`) |" >> $GITHUB_STEP_SUMMARY
              elif [[ "$fname" == *".tar.gz" ]]; then
                echo "| \`$fname\` ($size) | Self-Installer | Linux (Universal) | Universal archive with self-install/uninstall scripts |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| \`$fname\` ($size) | Archive | Generic | Platform archive |" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release Body Preview" >> $GITHUB_STEP_SUMMARY
          echo '```markdown' >> $GITHUB_STEP_SUMMARY
